descripcion = """
Vector addition is defined component by component, and the selector operator is used to prove that it is commutative.

Second video of the first lesson of the linear algebra course.

00:00 Title
00:03 Vector addition in Rn
00:41 Generic notation for addition
01:33 Proof of the commutative property of addition
02:56 Final credits

Two vectors with the same number of components are added component by component: the first component of the sum is the sum of the first components, and so on. To define addition in Rn without writing out the whole list, the selector operator is used: the i-th component of the sum is the sum of the i-th components. This gives the first rule of symbolic calculation, the distributive property of the selector over addition. With it, the video proves step by step that the order of the summands does not change the sum: it starts from the i-th component of one side and reaches that of the other using only this rule and the commutativity of the real numbers.

Corresponding book section (Section 1.2): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2 (the book is in Spanish)

Jupyter Notebooks: https://github.com/mbujosab/nacal-Jupyter-Notebooks

