descripcion = """
La suma de vectores se define componente a componente, y con el operador selector se demuestra que es conmutativa.

Segundo vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:04 Suma de vectores de Rn
00:43 Notación genérica para la suma
01:31 Demostración de la propiedad conmutativa de la suma
02:56 Créditos finales

Dos vectores con el mismo número de componentes se suman componente a componente: la primera componente de la suma es la suma de las primeras, y así con todas. Para definir la suma en Rn sin escribir la lista entera se usa el operador selector: la componente i-ésima de la suma es la suma de las componentes i-ésimas. De ahí sale la primera regla de cálculo simbólico, la propiedad distributiva del selector respecto de la suma. Con ella se demuestra, paso a paso, que el orden de los sumandos no altera la suma: se parte de la componente i-ésima de un lado y se llega a la del otro usando solo esa regla y la conmutativa de los números reales.

Correspondiente sección del libro (Sección 1.2): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Vídeo anterior: https://youtu.be/HWaQrbSc8WA
Siguiente vídeo: https://youtu.be/kSgd-davYhw
Lista completa del curso: https://www.youtube.com/playlist?list=PLA94O6zqDj0VREglVLepuCd0d8F0d-rnL

Este curso usa la notación del libro (listas y operador selector), presentada en el primer vídeo: https://youtu.be/HWaQrbSc8WA
Música: Zeta, de Vincent Rubinetti.
Licencia: Creative Commons BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/deed.es).
