descripcion = """
Las propiedades algebraicas de los números reales, vistas con regla y compás.

Quinto vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 Introducción: los números reales como puntos de una recta
01:06 La suma, con regla y compás: conmutativa, asociativa, el cero y el opuesto
03:11 El producto, con regla y compás: el uno, el inverso y la distributiva
05:04 Dos propiedades incómodas: conmutativa y asociativa del producto
06:44 Las reglas del juego: las nueve propiedades y «la notación lo es todo»
07:36 Créditos finales

Este vídeo no sigue una sección del libro: muestra con regla y compás, al modo de los geómetras griegos, las propiedades de los números reales que la Sección 1.2 da por conocidas y que el siguiente vídeo usará para estudiar las operaciones con vectores. Las propiedades se ilustran, no se demuestran; y se ve que la construcción geométrica es engorrosa, que es de donde nace la manera moderna de operar con símbolos.

Correspondiente sección del libro: https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Vídeo anterior: https://youtu.be/SG4ZwRAIQLY
Siguiente vídeo: https://youtu.be/Hrkks90PbVE
Lista completa del curso: https://www.youtube.com/playlist?list=PLA94O6zqDj0VREglVLepuCd0d8F0d-rnL

Este curso usa la notación del libro (listas y operador selector), presentada en el primer vídeo: https://youtu.be/HWaQrbSc8WA
Música: Zeta, de Vincent Rubinetti.
Licencia: Creative Commons BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/deed.es).
"""

