descripcion = """
The algebraic properties of the real numbers, seen with ruler and compass.

Fifth video of the first lesson of the linear algebra course.

00:00 Title.
00:06 Introduction: the real numbers as points on a line.
01:05 Addition, with ruler and compass: commutative, associative, zero and the opposite.
03:15 Multiplication, with ruler and compass: one, the inverse and the distributive property.
05:25 Two uncomfortable properties: commutativity and associativity of the product.
07:12 The rules of the game: the nine properties and "notation is everything".
08:02 Closing credits.

This video does not follow a section of the book: it shows with ruler and compass, in the manner of the Greek geometers, the properties of the real numbers that Section 1.2 takes for granted, and that the next video will use to study the operations with vectors. The properties are illustrated, not proved; and the geometric construction turns out to be cumbersome, which is where the modern way of operating with symbols comes from.

Corresponding book section: https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2

Jupyter Notebooks: https://github.com/mbujosab/nacal-Jupyter-Notebooks

