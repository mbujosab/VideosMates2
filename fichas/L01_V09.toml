descripcion = """
Una matriz es una lista ordenada de vectores con el mismo número de componentes: sus columnas.

Noveno vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 De la tabla del PIB a la matriz
00:34 Un ejemplo: la posición de cada vector importa
00:56 El orden de una matriz
01:51 Igualdad de matrices
02:09 Notación: corchetes, matriz columna y matriz nula
03:25 Resumen
03:49 Créditos finales

La tabla con el crecimiento del PIB de cinco países del vídeo anterior es una matriz: una lista de vectores, que son sus columnas. Con tres vectores de dos componentes formamos una matriz y vemos que, si los cambiamos de sitio en la lista, la matriz es otra. Una segunda matriz, hecha con las filas de la primera, tiene los mismos números pero es una lista distinta: eso es lo que indica el orden (filas por columnas). De ahí la igualdad de matrices, columna a columna. Después, la notación (corchetes alrededor de vectores separados por puntos y comas, la matriz columna, que no es un vector, y la matriz nula).

Correspondiente sección del libro (Sección 1.4): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.4

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Vídeo anterior: https://youtu.be/w62nh5CvJtM
Siguiente vídeo: (se añade al publicarlo)
Lista completa del curso: https://www.youtube.com/playlist?list=PLA94O6zqDj0VREglVLepuCd0d8F0d-rnL

Este curso usa la notación del libro (listas y operador selector), presentada en el primer vídeo: https://youtu.be/HWaQrbSc8WA
