descripcion = """
A matrix is an ordered list of vectors with the same number of components: its columns.

Ninth video of the first lesson of the linear algebra course.

00:00 Title
00:06 From the GDP table to a matrix
00:33 An example: the position of each vector matters
00:55 The order of a matrix
01:52 Equality of matrices
02:06 Notation: square brackets, column matrix and zero matrix
03:19 Key takeaways
03:44 Closing credits

The table with the GDP growth of five countries from the previous video is a matrix: a list of vectors, which are its columns. With three vectors of two components we build a matrix and see that, if we move them to other places in the list, we get a different matrix. A second matrix, made from the rows of the first, has the same numbers but is a different list: that is what its order (rows by columns) tells us. Hence the equality of matrices, column by column. Then the notation (square brackets around vectors separated by semicolons, the column matrix, which is not a vector, and the zero matrix).

Corresponding book section (Section 1.4): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.4 (the book is in Spanish)

