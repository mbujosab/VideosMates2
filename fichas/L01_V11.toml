descripcion = """
Transponer una matriz convierte sus filas en columnas, y equivale a cambiar de lado los índices.

Undécimo vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 La transposición
00:47 Transponer es cambiar de lado los índices
01:42 La transpuesta de la transpuesta (ejercicio)
02:31 Resumen
02:48 Créditos finales

A partir de una matriz A formamos otra matriz B cuyas columnas son las filas de A: B es la transpuesta de A; cada columna de la transpuesta es la fila de A con el mismo índice, y su orden es el inverso. La transpuesta de una matriz columna es una matriz fila. De la definición comprobamos la regla de reescritura «transponer, o quitar la transposición, cambia de lado los índices», y que las filas de la transpuesta son las columnas de la matriz. Por último, un ejercicio: la transpuesta de la transpuesta es la matriz original.

Correspondiente sección del libro (Sección 1.4.5): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#subsection.1.4.5

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Vídeo anterior: https://youtu.be/gpVJnl4nAdU
Siguiente vídeo: (se añade al publicarlo)
Lista completa del curso: https://www.youtube.com/playlist?list=PLA94O6zqDj0VREglVLepuCd0d8F0d-rnL

Este curso usa la notación del libro (listas y operador selector), presentada en el primer vídeo: https://youtu.be/HWaQrbSc8WA
Música: Zeta, de Vincent Rubinetti.
Licencia: Creative Commons BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/deed.es).
