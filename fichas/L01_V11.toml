descripcion = """
Transposing a matrix turns its rows into columns, and amounts to moving the indices to the other side.

Eleventh video of the first lesson of the linear algebra course.

00:00 Title
00:06 Transposition
00:50 Transposing moves the indices to the other side
01:45 The transpose of the transpose (exercise)
02:34 Key takeaways
02:51 Closing credits

From a matrix A we build another matrix B whose columns are the rows of A: B is the transpose of A; each column of the transpose is the row of A with the same index, and its order is reversed. The transpose of a column matrix is a row matrix. From the definition we check the rewriting rule "transposing, or removing the transposition, moves the indices to the other side", and that the rows of the transpose are the columns of the matrix. Finally, an exercise: the transpose of the transpose is the original matrix.

Corresponding book section (Section 1.4.5): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#subsection.1.4.5 (the book is in Spanish)

