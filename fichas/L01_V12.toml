descripcion = """
Square, diagonal, zero, identity and symmetric matrices, described with the notation of the course.

Twelfth video of the first lesson of the linear algebra course.

00:00 Title
00:06 Square matrices
00:37 Diagonal, zero and identity matrices
01:32 Symmetric matrices
02:26 Components of a symmetric matrix
03:21 Square diagonal, hence symmetric (exercise)
05:11 Key takeaways
05:50 Closing credits

A matrix is square if it has as many rows as columns, and diagonal if its components outside the main diagonal are zero; zero matrices and identity matrices are particular cases. A matrix is symmetric if it is equal to its transpose. We prove that every symmetric matrix is square and, with the criterion of equality component by component, that its components mirror each other across the main diagonal. Finally, an exercise: every square diagonal matrix is symmetric; hence identity matrices are symmetric.

Corresponding book section (Section 1.4.6): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#subsection.1.4.6 (the book is in Spanish)

