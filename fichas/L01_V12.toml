descripcion = """
Matrices cuadradas, diagonales, nulas, identidad y simétricas, descritas con la notación del curso.

Duodécimo vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 Matrices cuadradas
00:38 Matrices diagonales, nulas e identidad
01:35 Matrices simétricas
02:27 Componentes de una matriz simétrica
03:20 Diagonal y cuadrada, luego simétrica (ejercicio)
05:07 Resumen
05:44 Créditos finales

Una matriz es cuadrada si tiene tantas filas como columnas, y diagonal si sus componentes fuera de la diagonal principal son nulas; las matrices nulas y las matrices identidad son casos particulares. Una matriz es simétrica si es igual a su transpuesta. Demostramos que toda matriz simétrica es cuadrada y, con el criterio de igualdad componente a componente, que sus componentes son la imagen especular unas de otras respecto a la diagonal principal. Por último, un ejercicio: toda matriz diagonal y cuadrada es simétrica; por tanto, las matrices identidad son simétricas.

Correspondiente sección del libro (Sección 1.4.6): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#subsection.1.4.6

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Vídeo anterior: https://youtu.be/(id de V11, la transposición, al publicarlo)
