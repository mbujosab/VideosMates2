descripcion = """
Como la suma de vectores es componente a componente y conmutativa, tiene una interpretación geométrica: la regla del paralelogramo.

Tercer vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:04 Propiedades sobre las que se basa la interpretación geométrica
00:16 Interpretación de la suma en R2
04:25 Interpretación de la suma en R3
04:55 Interpretación de la suma en Rn
05:52 Lo más importante son las propiedades, no la interpretación geométrica
06:25 Créditos finales

En R2 cada vector se interpreta como un punto del plano, con sus componentes como coordenadas, y se señala con una flecha desde el origen. Sumar dos vectores es seguir primero las indicaciones de una flecha y después las de la otra; como la suma es conmutativa, el orden da igual y los dos caminos forman un paralelogramo cuya diagonal es la suma. Lo mismo ocurre en R3, y en Rn sirve como esquema, aunque ya no se pueda dibujar. El vídeo insiste en que la representación de un vector es el punto, y la flecha solo una ayuda. Y en que lo fundamental no es el dibujo, sino las reglas de las que nace: el selector es distributivo respecto de la suma y la suma de números reales es conmutativa.

Correspondiente sección del libro (Sección 1.2): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2
El libro no trata la interpretación geométrica, solo las propiedades algebraicas de las operaciones.

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Vídeo anterior: https://youtu.be/LvcerzXX3IM
Siguiente vídeo: https://youtu.be/SG4ZwRAIQLY
