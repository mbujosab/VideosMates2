descripcion = """
Since vector addition is component-wise and commutative, it has a geometric interpretation: the parallelogram rule.

Third video of the first lesson of the linear algebra course.

00:00 Title
00:04 Properties on which the geometric interpretation is based
00:16 Interpretation of addition in R2
04:22 Interpretation of addition in R3
04:52 Interpretation of addition in Rn
05:49 The most important thing is the properties, not the geometric interpretation
06:24 Final credits

In R2 each vector is read as a point of the plane, with its components as coordinates, and is marked with an arrow from the origin. Adding two vectors means following the directions of one arrow and then those of the other; since addition is commutative, the order does not matter and the two paths form a parallelogram whose diagonal is the sum. The same happens in R3, and in Rn it works as a sketch, even though it can no longer be drawn. The video stresses that a vector is represented by the point, and the arrow is only an aid. And that what matters is not the picture but the rules it comes from: the selector distributes over addition, and addition of real numbers is commutative.

Corresponding book section (Section 1.2): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2 (the book is in Spanish)
The book does not cover the geometric interpretation, only the algebraic properties of the operations.

Jupyter Notebooks: https://github.com/mbujosab/nacal-Jupyter-Notebooks

