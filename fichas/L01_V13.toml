La suma de matrices y el producto de una matriz por un escalar, definidos columna a columna, y sus ocho propiedades.

Decimotercer vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 Suma de matrices
00:51 Producto de una matriz por un escalar
01:20 Componente a componente
02:14 Matrices nulas y matriz opuesta
02:38 Las mismas definiciones
03:02 La conmutativa, cambiando los símbolos
04:23 La propiedad del opuesto, cambiando los símbolos
05:24 Las ocho propiedades
05:45 Resumen
06:35 Créditos finales

Dos matrices del mismo orden se suman columna a columna, y una matriz se multiplica por un escalar multiplicando cada una de sus columnas; por tanto, ambas operaciones también se hacen componente a componente. Las matrices nulas y la matriz opuesta se definen igual que con los vectores. Las definiciones son las de los vectores con las letras en mayúscula, así que las demostraciones de las propiedades de los vectores sirven para las matrices con solo cambiar los símbolos: lo vemos con la propiedad conmutativa y con la del opuesto, y las demás quedan como ejercicio. Las demostraciones solo usan reglas para manipular símbolos.

