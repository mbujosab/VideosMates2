Matrix addition and the product of a matrix by a scalar, defined column by column, and their eight properties.

Thirteenth video of the first lecture of the linear algebra course.

00:00 Title
00:06 Matrix addition
00:53 Product of a matrix by a scalar
01:22 Component by component
02:15 Zero matrices and the opposite matrix
02:39 The same definitions
03:02 The commutative property, changing the symbols
04:18 The property of the opposite, changing the symbols
05:20 The eight properties
05:41 Key takeaways
06:29 Closing credits

Two matrices of the same order are added column by column, and a matrix is multiplied by a scalar by multiplying each of its columns; therefore both operations are also done component by component. Zero matrices and the opposite matrix are defined just as for vectors. The definitions are those of vectors with capital letters, so the proofs of the properties of vectors work for matrices just by changing the symbols: we see it with the commutative property and with the property of the opposite, and the others are left as an exercise. The proofs only use rules for manipulating symbols.

Corresponding book section (Section 1.5): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.5 (the book is in Spanish)

Notebook for this section (Binder; it takes a moment to start): https://mybinder.org/v2/gh/mbujosab/nacal-jupyter-notebooks/master?urlpath=lab/tree/Eng/Lecc01-Secc1.5-Eng.ipynb
