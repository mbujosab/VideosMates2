descripcion = """
Multiplicar un vector por un escalar multiplica cada componente; los múltiplos de un vector no nulo forman una recta que pasa por el origen.

Cuarto vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:03 Introducción
00:57 Definición del producto de un vector de Rn por un escalar
02:00 Interpretación geométrica del producto de dos números naturales
03:04 Producto de un número real positivo por un número natural
03:24 Hacia el producto de dos números reales
04:41 Procedimiento geométrico para multiplicar dos números reales
06:18 Interpretación del producto de un vector de R2 por un escalar
08:35 Interpretación del producto de un vector de R3 por un escalar
09:55 Lo más importante son las propiedades, no la interpretación geométrica
10:32 Créditos finales

El producto de un vector por un escalar se define componente a componente, y con el operador selector se escribe para Rn: de ahí sale la segunda regla de cálculo simbólico, la asociativa del selector respecto del producto, que permite desplazar los paréntesis. Para interpretarlo geométricamente, el vídeo presenta primero un método gráfico para multiplicar dos números reales cualesquiera con una recta paralela a la diagonal de un rectángulo, que respeta la regla de los signos. Con ese método se multiplican las dos componentes de un vector de R2 por el mismo número: el vector se alarga, se acorta o cambia de sentido, y todos sus múltiplos quedan en una recta que pasa por el origen. Lo mismo ocurre en R3. Esta presentación del producto de números reales no es habitual en otros vídeos o manuales de álgebra lineal.

Correspondiente sección del libro (Sección 1.2): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2
El libro no trata la interpretación geométrica, solo las propiedades algebraicas de las operaciones.

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Vídeo anterior: https://youtu.be/kSgd-davYhw
Siguiente vídeo: https://youtu.be/nfftYHyi0hU
Lista completa del curso: https://www.youtube.com/playlist?list=PLA94O6zqDj0VREglVLepuCd0d8F0d-rnL

Este curso usa la notación del libro (listas y operador selector), presentada en el primer vídeo: https://youtu.be/HWaQrbSc8WA
Música: Zeta, de Vincent Rubinetti.
Licencia: Creative Commons BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/deed.es).
