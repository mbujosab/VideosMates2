descripcion = """
Multiplying a vector by a scalar multiplies each component; the multiples of a nonzero vector form a line through the origin.

Fourth video of the first lesson of the linear algebra course.

00:00 Title
00:03 Introduction
00:47 Definition of the product of a vector in Rn by a scalar
01:38 Geometric interpretation of the product of two natural numbers
02:25 Product of a positive real number by a natural number
02:45 Towards the product of two real numbers
03:28 Sign rules multiplying two real numbers
04:04 Using any axes
04:35 Interpretation of the product of a vector in R2 by a scalar
06:26 Interpretation of the product of a vector in R3 by a scalar
07:44 Prioritize manipulation rules over interpretation
08:08 Closing credits

Multiplying a vector by a scalar is defined component by component, and the selector operator writes it for Rn: this gives the second rule of symbolic calculation, the associativity of the selector with respect to the product, which lets the parentheses be moved. To interpret it geometrically, the video first presents a graphical method to multiply any two real numbers with a line parallel to the diagonal of a rectangle, which respects the sign rules. With this method both components of a vector in R2 are multiplied by the same number: the vector gets longer, shorter or reverses direction, and all its multiples lie on a line through the origin. The same happens in R3. This presentation of the product of real numbers is not common in other linear algebra videos or textbooks.

Corresponding book section (Section 1.2): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2 (the book is in Spanish)
The book does not cover the geometric interpretation, only the algebraic properties of the operations.

Jupyter Notebooks: https://github.com/mbujosab/nacal-Jupyter-Notebooks

