subtitulos = "../videoMath2/L01_V07_PropertiesOfScalarMultiplication.srt"
idioma = "en"
titulo = "L01 V07 Properties of scalar multiplication (English)"
lista = "Linear Algebra Course"
etiquetas = ["linear algebra", "vectors", "scalar multiplication", "distributive property",
             "associative property", "proofs", "algebraic properties", "mathematics", "GECO", "UCM"]
descripcion = """
The four properties of multiplying a vector in Rn by a scalar, proved component-wise.

Seventh video of the first lesson of the linear algebra course.

00:00 Title
00:06 Examples
00:40 The method
01:10 Property 5: distributive over vector addition
02:40 Property 6: distributive over scalar addition
04:11 Property 7: associative
05:15 Property 8: one is the identity element
06:13 Key takeaways
06:35 Closing credits

As in the previous video, each property is first posed as an exercise (pause the video and try it) and then proved step by step: a chain of equalities from the i-th component of the left-hand side to that of the right-hand side, using in each step a single definition or a single property of the real numbers. Together with the four properties of addition, these are the eight properties that will define a vector space.

Corresponding book section (Exercise 4 of Section 1.2.1): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2

Jupyter Notebooks: https://github.com/mbujosab/nacal-Jupyter-Notebooks
"""
