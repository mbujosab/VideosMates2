descripcion = """
Las cuatro propiedades del producto de un vector de Rn por un escalar, demostradas componente a componente.

Séptimo vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 Ejemplos
00:38 El método
01:06 Propiedad 5: distributiva respecto de la suma de vectores
02:37 Propiedad 6: distributiva respecto de la suma de escalares
04:08 Propiedad 7: asociativa
05:12 Propiedad 8: el uno es el elemento neutro
06:13 Resumen
06:35 Créditos finales

Como en el vídeo anterior, cada propiedad se propone primero como ejercicio (pause el vídeo e inténtelo) y después se demuestra paso a paso: una cadena de igualdades desde la componente i-ésima del lado izquierdo hasta la del lado derecho, usando en cada paso una sola definición o una sola propiedad de los números reales. Con las cuatro propiedades de la suma, son las ocho propiedades que definirán el espacio vectorial.

Correspondiente sección del libro (Ejercicio 4 de la Sección 1.2.1): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Vídeo anterior: https://youtu.be/Hrkks90PbVE
Siguiente vídeo: https://youtu.be/w62nh5CvJtM
Lista completa del curso: https://www.youtube.com/playlist?list=PLA94O6zqDj0VREglVLepuCd0d8F0d-rnL

Este curso usa la notación del libro (listas y operador selector), presentada en el primer vídeo: https://youtu.be/HWaQrbSc8WA
Música: Zeta, de Vincent Rubinetti.
Licencia: Creative Commons BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/deed.es).
"""

