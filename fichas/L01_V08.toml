descripcion = """
Un vector sirve para guardar datos: lo que importa es la posición de cada componente.

Octavo vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 La cena: cada receta es un vector
00:53 La cesta de la compra: suma y producto por un número
01:21 Omega se apunta: una combinación lineal
01:55 Datos económicos: el crecimiento del PIB
02:29 Resumen y cuatro vectores en una tabla
03:07 Créditos finales

Tres amigos preparan una cena; cada receta es un vector con los ingredientes de una ración, siempre en el mismo orden. Sumar las recetas componente a componente y multiplicar por el número de comensales da la cesta de la compra, y añadir cuatro raciones más de tortilla da una combinación lineal de las recetas. Después, el mismo uso de los vectores con datos económicos: el crecimiento del PIB de cinco países entre 2003 y 2006, que en el próximo vídeo se convertirá en una matriz.

Correspondiente sección del libro (Sección 1.3): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.3

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks
"""

