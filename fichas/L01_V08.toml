A vector can store data: what matters is the position of each component.

Eighth video of the first lesson of the linear algebra course.

00:00 Title
00:06 The dinner: each recipe is a vector
00:53 The shopping basket: addition and multiplication by a number
01:23 Omega joins in: a linear combination
01:55 Economic data: GDP growth
02:27 Key takeaways and four vectors in a table
03:02 Closing credits

Three friends prepare a dinner; each recipe is a vector with the ingredients for one serving, always in the same order. Adding the recipes component-wise and multiplying by the number of diners gives the shopping basket, and adding four more servings of tortilla gives a linear combination of the recipes. Then the same use of vectors with economic data: the GDP growth of five countries from 2003 to 2006, which will become a matrix in the next video.

Corresponding book section (Section 1.3): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.3 (the book is in Spanish)

