descripcion = """
Matrices are also added and multiplied by a scalar row by row, and transposition is a linear operator.

Fourteenth video of the first lecture of the linear algebra course.

00:00 Title
00:06 An example, seen by rows
00:49 Addition, row by row
01:53 Linear operators
02:33 The transpose of a sum
03:48 The transpose of a product by a scalar
04:38 Key takeaways
04:58 Closing credits

In an example, each row of the sum of two matrices is the sum of their rows, and each row of the product by a scalar is the scalar times the row. We prove it for any matrix using the definitions of matrix addition and vector addition: the row selector, like the column selector, distributes over sums and is associative with the product by a scalar; that is, it is a linear operator. Then we prove that transposition is linear too: adding first and transposing afterwards gives the same as transposing first and adding afterwards, and the same holds for the product by a scalar.

Corresponding book sections (Sections 1.5.3 and 1.5.4): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#subsection.1.5.3 (the book is in Spanish)

