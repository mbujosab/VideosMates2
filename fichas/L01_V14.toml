descripcion = """
Las matrices también se suman y se multiplican por un escalar fila a fila, y la transposición es un operador lineal.

Decimocuarto vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 Un ejemplo, mirado por filas
00:48 La suma, fila a fila
01:57 Operadores lineales
02:37 La transpuesta de una suma
03:51 La transpuesta de un producto por un escalar
04:42 Resumen
05:02 Créditos finales

En un ejemplo, cada fila de la suma de dos matrices es la suma de sus filas, y cada fila del producto por un escalar es el producto del escalar por la fila. Lo demostramos para cualquier matriz con las definiciones de suma de matrices y de vectores: el selector de filas, como el de columnas, se distribuye en las sumas y es asociativo con el producto por un escalar; es decir, es un operador lineal. Después demostramos que la transposición también lo es: da igual sumar primero y transponer después, que transponer primero y sumar después, y lo mismo con el producto por un escalar.

Correspondientes secciones del libro (Secciones 1.5.3 y 1.5.4): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#subsection.1.5.3

