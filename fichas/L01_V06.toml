#   ~/.venvs/manim/bin/python lib/subir_youtube.py actualizar fichas/L01_V06.toml en   # usa el campo youtube de la ficha (o --id)
# Los capítulos son los inicios de escena que imprime el bloque `montaje` (versión 1080p60).

