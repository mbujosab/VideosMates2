video = "L01_V06_PropiedadesDeLaSumaDeVectores.mp4"
subtitulos = "L01_V06_PropiedadesDeLaSumaDeVectores.srt"
idioma = "es"
titulo = "L01 V06 Propiedades de la suma de vectores (Español)"
lista = "Curso de Álgebra Lineal"   # título exacto de la lista (o su identificador PL...)
etiquetas = ["álgebra lineal", "vectores", "suma de vectores", "vector nulo", "vector opuesto",
             "demostraciones", "propiedades algebraicas", "matemáticas", "GECO", "UCM"]
descripcion = """
Las cuatro propiedades de la suma de vectores de Rn, demostradas componente a componente.

Sexto vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 Dos vectores especiales: el vector nulo y el opuesto
01:14 Cómo demostrar una igualdad entre vectores
02:04 Propiedad 1: la suma es conmutativa
03:18 Propiedad 2: la suma es asociativa
04:39 Propiedad 3: el vector nulo es el elemento neutro
05:37 Propiedad 4: todo vector tiene un opuesto
06:54 Resumen
07:32 Créditos finales

Cada propiedad se propone primero como ejercicio (pause el vídeo e inténtelo) y después se demuestra paso a paso: una cadena de igualdades desde la componente i-ésima del lado izquierdo hasta la del lado derecho, usando en cada paso una sola definición o una sola propiedad de los números reales (las vistas en el vídeo anterior). Así la demostración vale para vectores de cualquier tamaño.

Correspondiente sección del libro (Sección 1.1.1 y Ejercicio 4 de la Sección 1.2.1): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks
"""

