youtube = "WudpCJUYBiA"   # https://youtu.be/WudpCJUYBiA (subido 2026-10-17)
video = "../videoMath2/L01_V06_PropertiesOfVectorAddition.mp4"
subtitulos = "../videoMath2/L01_V06_PropertiesOfVectorAddition.srt"
idioma = "en"
titulo = "L01 V06 Properties of vector addition (English)"
lista = "Linear Algebra Course"
etiquetas = ["linear algebra", "vectors", "vector addition", "zero vector", "opposite vector",
             "proofs", "algebraic properties", "mathematics", "GECO", "UCM"]
descripcion = """
The four properties of vector addition in Rn, proved component-wise.

Sixth video of the first lesson of the linear algebra course.

00:00 Title
00:06 Two special vectors: the zero vector and the opposite
01:15 How to prove an equality between vectors
02:03 Property 1: addition is commutative
03:15 Property 2: addition is associative
04:37 Property 3: the zero vector is the identity element
05:36 Property 4: every vector has an opposite
06:53 Key takeaways
07:31 Closing credits

Each property is first posed as an exercise (pause the video and try it) and then proved step by step: a chain of equalities from the i-th component of the left-hand side to that of the right-hand side, using in each step a single definition or a single property of the real numbers (those seen in the previous video). That way the proof holds for vectors of any size.

Corresponding book section (Section 1.1.1 and Exercise 4 of Section 1.2.1): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.2

Jupyter Notebooks: https://github.com/mbujosab/nacal-Jupyter-Notebooks
"""
