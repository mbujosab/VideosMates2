descripcion = """
Un vector de Rn es una lista ordenada de n números reales: cómo se escribe y cómo se nombran sus componentes con el operador selector.

Primer vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:04 Definición de vector
00:52 Notación con vectores
01:57 Notación para sus elementos
03:14 Créditos finales

Un vector de Rn es una lista ordenada de n números reales: importa el orden, así que dos vectores son iguales solo si sus listas son idénticas. Como lo que cuenta es la lista, el mismo vector se puede escribir en horizontal o en vertical, siempre entre paréntesis y, en horizontal, con una coma detrás de cada número; así se distingue un número entre paréntesis de un vector de R1. Los vectores se nombran con minúsculas en negrita, y el cero en negrita es el vector nulo. Para las componentes, en lugar del subíndice habitual, el curso usa el operador selector: una barra vertical entre el vector y la posición, que puede actuar por la derecha o por la izquierda.

Correspondiente sección del libro (Sección 1.1): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.1

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Siguiente vídeo: https://youtu.be/LvcerzXX3IM
Lista completa del curso: https://www.youtube.com/playlist?list=PLA94O6zqDj0VREglVLepuCd0d8F0d-rnL

Este vídeo presenta la notación del libro (listas y operador selector) que usa todo el curso.
Música: Zeta, de Vincent Rubinetti.
