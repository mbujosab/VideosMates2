descripcion = """
A vector in Rn is an ordered list of n real numbers: how to write it and how to name its components with the selector operator.

First video of the first lesson of the linear algebra course.

00:00 Title
00:04 Definition of a vector
00:47 Vector notation
01:50 Notation for its components
03:03 End credits

A vector in Rn is an ordered list of n real numbers: order matters, so two vectors are equal only if their lists are identical. Since what counts is the list, the same vector can be written horizontally or vertically, always in parentheses and, horizontally, with a comma after each number; this tells a number in parentheses apart from a vector in R1. Vectors are named with bold lowercase letters, and a bold zero is the zero vector. For the components, instead of the usual subscript, the course uses the selector operator: a vertical bar between the vector and the position, which can act from the right or from the left.

Corresponding book section (Section 1.1): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#section.1.1 (the book is in Spanish)

Jupyter Notebooks: https://github.com/mbujosab/nacal-Jupyter-Notebooks

