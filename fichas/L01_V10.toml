descripcion = """
The selector operator picks a column from the right, a row from the left and a component from both sides, in any order.

Tenth video of the first lesson of the linear algebra course.

00:00 Title
00:06 Rows and columns with the selector operator
00:46 Components: row first or column first
02:09 Key takeaways
02:29 Closing credits

A matrix is a list of vectors, so the selector on the right, as with vectors, selects the element of the list in that position: a column. On the left it selects a row. Rows and columns are vectors, and they are written horizontally or vertically, always in parentheses. Each component lies both in a row and in a column: the seven in the example is obtained by selecting the row first or the column first, with the same result. It is an associative property, and that is why the selector is written on both sides of the matrix, without parentheses. Finally, the usual textbook notation, a sub ij, next to the selector.

Corresponding book section (Section 1.4.3): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#subsection.1.4.3 (the book is in Spanish)

