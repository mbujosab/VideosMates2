descripcion = """
El operador selector elige una columna por la derecha, una fila por la izquierda y una componente por los dos lados, en cualquier orden.

Décimo vídeo de la lección primera del curso de álgebra lineal.

00:00 Título
00:06 Filas y columnas con el operador selector
00:48 Componentes: primero la fila o primero la columna
02:09 Resumen
02:30 Créditos finales

Una matriz es una lista de vectores, así que el selector a la derecha, como en los vectores, selecciona el elemento de la lista que ocupa esa posición: una columna. A la izquierda selecciona una fila. Filas y columnas son vectores, y se escriben en horizontal o en vertical, siempre entre paréntesis. Cada componente está a la vez en una fila y en una columna: el siete del ejemplo se obtiene seleccionando primero la fila o primero la columna, con el mismo resultado. Es una propiedad asociativa, y por eso el selector se escribe a ambos lados de la matriz, sin paréntesis. Al final, la notación habitual de los libros, a sub ij, frente al selector.

Correspondiente sección del libro (Sección 1.4.3): https://mbujosab.github.io/CursoDeAlgebraLineal/libro.pdf#subsection.1.4.3

Notebooks de jupyter: https://github.com/mbujosab/nacal-Jupyter-Notebooks

Vídeo anterior: https://youtu.be/9w6gEv3XrTc
Siguiente vídeo: (se añade al publicarlo)
Lista completa del curso: https://www.youtube.com/playlist?list=PLA94O6zqDj0VREglVLepuCd0d8F0d-rnL

Este curso usa la notación del libro (listas y operador selector), presentada en el primer vídeo (https://youtu.be/HWaQrbSc8WA) y en este.
Música: Zeta, de Vincent Rubinetti.
Licencia: Creative Commons BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/deed.es).
"""

